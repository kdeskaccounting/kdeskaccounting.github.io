scenes:
  - kind: title
    heading: ASC 606 Commission Accrual Workbook
    sub: 50 deals · three amortization bases · 60-month waterfall · journal entries · rollforward · reconciliation that ties to $0
    badge: EXCEL TEMPLATE · $79 ONE-TIME
    narration: >
      This is the KDesk ASC 606 commission accrual workbook. Fifty deals, three amortization bases —
      contract term, estimated benefit period, and the practical expedient — a sixty-month amortization
      waterfall, a journal entry generator, a deferred asset rollforward, and a reconciliation that ties
      to zero. Pure Excel, no macros. Here is how it works, tab by tab.
  - sheet: Setup
    range: A4:D14
    highlight: [C13]
    caption: One selected period drives every tab
    narration: >
      Everything starts on Setup. Choose the reporting period from the dropdown and every downstream tab —
      the waterfall, the journal entries, the rollforward — recalculates for that month. Close January,
      change one cell, and the whole workbook rolls forward. No re-keying.
  - sheet: Setup
    range: A16:D22
    highlight: [C22]
    caption: Estimated benefit period — a policy input, documented once
    narration: >
      The amortization policy lives here too. Immediately expensed for contracts under a year, contract
      term when renewal commissions are commensurate, and an estimated benefit period — sixty months in
      the sample — when the initial commission also buys the renewals. That is the biggest judgment in
      commission accounting, and it is one input, not a formula you rewrite.
  - sheet: Commission Data
    range: A4:J12
    highlight: [B5, E5, F5, H5]
    caption: Yellow cells are inputs — rep, deal, close date, amount, rate, term, basis
    narration: >
      Commission Data is the register. One row per deal: sales rep, deal ID, close date, deal amount,
      commission rate, contract term, and the amortization basis from a dropdown. Fifteen sample deals are
      loaded, including a twelve-month deal on the practical expedient and a de-booking that reverses a
      capitalized commission.
  - sheet: Commission Data
    range: H4:M12
    highlight: [I5, K5]
    caption: "Commission 10,000 over 24 months = 416.67 per month"
    narration: >
      The auto-calculated columns do the rest. Alice Chen's deal: one hundred twenty-five thousand at eight
      percent is a ten thousand dollar commission, amortized over the twenty-four month contract term at
      four hundred sixteen dollars and sixty-seven cents a month, with the start and end dates derived
      from the close date.
  - sheet: Amortization Schedule
    range: A4:P18
    highlight: [J7, J11, J15]
    caption: The waterfall — one row per deal, one column per month, sixty months
    narration: >
      The amortization schedule is the waterfall your auditor asks for. One row per deal, one column per
      month, sixty months wide, starting from the selected period. Each cell is that deal's amortization
      for that month; each column total is the month's expense entry. Extend a contract or add a deal and
      the row recalculates without touching the others.
  - sheet: JE Generator
    range: A3:I10
    highlight: [H5, I6, H9, I10]
    caption: "JE-001 capitalizes 16,000 · JE-003 amortizes 3,442.64 · debits = credits"
    narration: >
      The journal entry generator posts the selected period — January in the sample. J E one capitalizes
      the sixteen thousand dollars of commissions on deals closed in the month: debit deferred commission
      asset, credit commissions payable. J E three amortizes the whole asset base for the month, three
      thousand four hundred forty-two dollars and sixty-four cents. Practical expedient deals go straight
      to expense. Every line carries the GL code from Setup.
  - sheet: JE Generator
    range: A12:I22
    highlight: [B14, B18, H22]
    caption: "Beginning 53,857.08 + capitalized 16,000 − amortized 3,442.64 = ending 66,414.44 · check $0"
    narration: >
      Below the entries, a support block explains each number: beginning asset balance of fifty-three
      thousand eight hundred fifty-seven, plus sixteen thousand capitalized, minus the month's
      amortization, equals an ending balance of sixty-six thousand four hundred fourteen — with the
      formula source spelled out for each line. And the check at the bottom: debits minus credits, zero.
  - sheet: Rollforward
    range: A4:F16
    highlight: [B5, D5, E5]
    caption: "Jan 2026: 53,857.08 + 16,000.00 − 3,442.64 = 66,414.44"
    narration: >
      Rollforward is the balance sheet view of the deferred commission asset, month by month: beginning
      balance, plus capitalized, minus amortized, equals ending. The last column is an independent asset
      balance check that has to agree with the schedule.
  - sheet: Reconciliation
    range: A4:E9
    highlight: [E6, E7, E8, E9]
    caption: "16,000 capitalized · 3,442.64 amortized · 66,414.44 ending — variance $0 on every line"
    narration: >
      Reconciliation is the tab your auditor opens first. Capitalized commissions, immediately expensed
      commissions, the month's amortization, and the ending asset balance — from the journal entries on
      one side and the schedule on the other. Every variance reads zero.
  - sheet: Dashboard
    range: A4:G19
    highlight: [B6, D6, F6]
    caption: "Capitalized 141,625 · period amortization 3,442.64 · deferred asset 66,414.44"
    narration: >
      The dashboard summarizes the period: one hundred forty-one thousand of capitalized commissions,
      this period's amortization, a deferred asset balance of sixty-six thousand four hundred fourteen,
      and deals by amortization basis. Screenshot it for the close package.
  - kind: outro
    heading: ASC 606 Commission Accrual Workbook
    lines:
      - 50 deals, 60-month waterfall, JE Generator, Rollforward, Reconciliation
      - Excel 2016+, Microsoft 365, and Excel for Mac — no macros
      - Free 5-deal version with the inputs and the schedule to test on your own deals
    price: "$79 one-time"
    url: kdeskaccounting.com/templates/asc606
    narration: >
      The full workbook is seventy-nine dollars, one time, no subscription. There is a free five-deal
      version with the inputs and the schedule so you can test it on your own deals first. Both are at
      kdeskaccounting.com, slash templates, slash asc606.
