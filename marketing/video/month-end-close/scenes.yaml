scenes:
  - kind: title
    heading: Month-End Close Checklist + Tie-Out Workbook
    sub: 42 tasks in 5 phases · 18 subledger-to-GL reconciliations · JE tracker · printable sign-off — free, pay what you want
    badge: FREE EXCEL WORKBOOK
    narration: >
      This is the KDesk month-end close checklist and tie-out workbook, and it is free. Forty-two
      pre-populated tasks across five close phases, eighteen standard subledger-to-G-L reconciliations
      with a materiality flag, a journal entry tracker with a debits-equals-credits check, and a printable
      sign-off page. Pure Excel, no macros. Here is how it holds a close together.
  - sheet: README & Setup
    range: B14:C22
    highlight: [C18, C20]
    caption: Company, period, materiality — every tab reads from Setup
    narration: >
      Setup takes a minute. Company name, fiscal year end, the current period, period end date,
      performance materiality — fifty thousand in the sample — reporting currency, and whether the period
      is locked in the G L. Every other tab reads these cells.
  - sheet: Close Calendar
    range: B5:H16
    highlight: [G6, G13, G15]
    caption: 42 pre-populated tasks in 5 phases — the status dropdown drives the color
    narration: >
      The close calendar is the checklist. Forty-two tasks grouped into phases: day one and two cutoff and
      data collection, subledger reconciliations, technical accounting schedules, equity and tax, then
      statements and review. Each task has an owner, a due date, a status dropdown that colors the row,
      and notes. Add rows for your team, delete what does not apply.
  - sheet: Reconciliations
    range: B5:I14
    highlight: [G8, H8, G11]
    caption: GL vs. subledger, variance flagged against materiality
    narration: >
      Reconciliations is the tie-out. Eighteen accounts pre-populated — cash, receivables, prepaids,
      deferred commissions, fixed assets, right-of-use assets, payables, accruals, lease liabilities,
      deferred revenue, equity. Enter the G L balance and the subledger balance; the variance and the
      within-materiality flag calculate. Here, receivables carry a three thousand two hundred fifty
      dollar difference, inside the threshold, so it flags OK — but it still gets a note.
  - sheet: JE Tracker
    range: B5:L10
    highlight: [G6, H7, I6]
    caption: Every JE logged with its source, preparer and reviewer
    narration: >
      The journal entry tracker logs every entry posted during the close — date, J E number, description,
      account, debit, credit, source workbook, preparer, reviewer, status. The sample shows the commission
      amortization entry from the ASC 606 workbook and the depreciation entry from the fixed asset
      workbook. At the bottom, a sanity check: sum of debits minus sum of credits, which has to be zero.
  - sheet: Sign-Off
    range: B2:F20
    highlight: []
    caption: Printable certification with auto-tabulated close metrics
    narration: >
      Sign-Off is the page you print. Tasks completed, in progress and blocked; reconciliations done and
      flagged; entries posted; debits equal credits — all tabulated from the other tabs — plus an exception
      list and signature blocks for preparer, reviewer and controller. That is the close package's cover
      sheet.
  - kind: outro
    heading: Month-End Close Checklist + Tie-Out Workbook
    lines:
      - Free — pay what you want, $0 minimum
      - Pairs with the ASC 606, ASC 842 and fixed asset workbooks that compute the schedules
      - Excel 2016+, Microsoft 365, and Excel for Mac — no macros
    price: "Free"
    url: kdeskaccounting.com/templates/month-end-close
    narration: >
      The workbook is free — pay what you want, zero minimum. It is the scaffolding that holds the close
      together; the technical schedules it reconciles to come from the ASC 606, ASC 842 and fixed asset
      workbooks. Download it at kdeskaccounting.com, slash templates, slash month-end-close.
