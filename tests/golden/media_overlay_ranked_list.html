<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1296px;height:2304px;overflow:hidden;
  background:transparent;
  color:#FFFFFF;font-family:Carlito, Arial, Helvetica, sans-serif;-webkit-font-smoothing:antialiased}
.card{position:absolute;left:71px;bottom:304px;max-height:1078px;width:1154px;height:auto;display:flex;flex-direction:column;
  padding:50px 49px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:22px;
  font-size:16.7px;letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:24px}
.bname{font-weight:700;color:#FFFFFF} .burl{color:#AAB6C4}
h1{font-size:47.4px;line-height:1.06;font-weight:700;letter-spacing:-.01em;
  margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:22.1px;line-height:1.25;color:#AAB6C4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rule{width:86px;height:4.9px;border-radius:999px;
  background:#FFD966;margin:24px 0}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  overflow:hidden}
.rows{list-style:none;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:18px;font-size:35.6px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
  border-radius:18px;padding:20px 28px}
.rank{min-width:2.1em;font-size:1em;font-weight:700;color:#FFD966;
  font-variant-numeric:tabular-nums}
.label{flex:1;font-size:.84em;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.value{font-size:1em;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.row.changed{flex-direction:column;align-items:stretch;gap:12px;
  padding:25px 28px}
.row.changed .label{flex:none;font-size:1em;font-weight:700;color:#FFD966;
  -webkit-line-clamp:1}
.note{font-size:.9em;line-height:1.32;color:#AAB6C4;white-space:normal}
.empty{border:3px dashed rgba(255,255,255,.22);border-radius:17px;
  padding:54px 32px;text-align:center;font-size:25.9px;
  color:#AAB6C4}
.foot{padding-top:19px;font-size:18.3px;font-weight:700;
  color:#FFD966}
.body{flex:0 0 auto}
.card{border-radius:24px;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:#343A46;opacity:.74;
  border:1.3px solid #FFD966;border-radius:inherit}
.card>*{position:relative;z-index:1}
</style></head><body>
<div class="card">
  <div class="brand"><span class="bname">Park Sheet</span><span class="burl">parksheet.com</span></div>
  <h1>Shortest waits right now</h1>
  <p class="sub">Magic Kingdom · minutes</p>
  <div class="rule"></div>
  <div class="body">
    <ul class="rows">
      <li class="row"><div class="rank">1</div><div class="label">Tomorrowland Speedway</div><div class="value">5</div></li>
      <li class="row"><div class="rank">2</div><div class="label">The Barnstormer</div><div class="value">10</div></li>
      <li class="row"><div class="rank">3</div><div class="label">Dumbo the Flying Elephant</div><div class="value">15</div></li>
    </ul>
  </div>
  <div class="foot">Powered by Queue-Times.com</div>
</div>
</body></html>
